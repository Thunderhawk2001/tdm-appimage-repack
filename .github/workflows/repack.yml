name: Repack AppImage

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

concurrency:
  group: repack
  cancel-in-progress: false

env:
  UPSTREAM: DevilXD/TwitchDropsMiner
  UPSTREAM_TAG: dev-build

jobs:
  repack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check upstream commit
        id: check
        shell: bash
        run: |
          set -euo pipefail

          BODY="$(gh api "repos/${UPSTREAM}/releases/tags/${UPSTREAM_TAG}" --jq '.body')"
          SHA="$(grep -oE 'Reference commit:[^0-9a-f]*[0-9a-f]{40}' <<<"${BODY}" | grep -oE '[0-9a-f]{40}$' | head -n 1 || true)"
          BUILD_DATE="$(sed -nE 's/.*Last build date:[^0-9]*([0-9-]+ [0-9:]+\+[0-9:]+).*/\1/p' <<<"${BODY}" | head -n 1 || true)"

          if [[ -z "${SHA}" ]]; then
            echo "::error::Kein Reference commit im Upstream-Release gefunden"
            exit 1
          fi

          OWN_TAG="dev-${SHA:0:7}"
          echo "Upstream commit: ${SHA} -> eigener Tag: ${OWN_TAG}"

          if gh release view "${OWN_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${OWN_TAG} existiert bereits, nichts zu tun."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "own_tag=${OWN_TAG}"
            echo "sha=${SHA}"
            echo "build_date=${BUILD_DATE}"
          } >> "$GITHUB_OUTPUT"

      - name: Download, verify, unpack and publish
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          OWN_TAG: ${{ steps.check.outputs.own_tag }}
          SHA: ${{ steps.check.outputs.sha }}
          BUILD_DATE: ${{ steps.check.outputs.build_date }}
        run: |
          set -euo pipefail

          mkdir -p dl release_assets

          gh release download "${UPSTREAM_TAG}" --repo "${UPSTREAM}" \
            --pattern 'Twitch.Drops.Miner.Linux.AppImage-x86_64.zip' \
            --pattern 'Twitch.Drops.Miner.Linux.AppImage-aarch64.zip' \
            --dir dl

          if [[ ! -f dl/Twitch.Drops.Miner.Linux.AppImage-x86_64.zip ]]; then
            echo "::error::x86_64 Archiv fehlt"
            exit 1
          fi

          # Upstream-ZIPs gegen den digest der Release-API pruefen
          DIGESTS="$(gh api "repos/${UPSTREAM}/releases/tags/${UPSTREAM_TAG}" --jq '.assets[] | "\(.name) \(.digest // "")"')"
          : > zip_sums.txt
          for z in dl/*.zip; do
            name="$(basename "${z}")"
            actual="$(sha256sum "${z}" | cut -d' ' -f1)"
            expected="$(awk -v n="${name}" '$1==n {sub(/^sha256:/,"",$2); print $2}' <<<"${DIGESTS}")"
            if [[ -z "${expected}" ]]; then
              echo "::warning::Kein Upstream-Digest fuer ${name}, nicht verifiziert"
              status="not verified"
            elif [[ "${expected}" != "${actual}" ]]; then
              echo "::error::Digest-Abweichung bei ${name}: erwartet ${expected}, erhalten ${actual}"
              exit 1
            else
              echo "OK ${name} ${actual}"
              status="matches upstream digest"
            fi
            echo "${actual}  ${name} (${status})" >> zip_sums.txt
          done

          for z in dl/*.zip; do
            d="unpack_$(basename "${z}" .zip)"
            unzip -o -q "${z}" -d "${d}"
            f="$(find "${d}" -type f -name '*.AppImage' -print -quit)"
            if [[ -n "${f}" ]]; then
              mv "${f}" release_assets/
            fi
          done

          chmod +x release_assets/*.AppImage
          (cd release_assets && sha256sum *.AppImage > SHA256SUMS)
          ls -l release_assets
          cat release_assets/SHA256SUMS

          {
            echo "Automated repack of upstream ${UPSTREAM_TAG} (commit ${SHA}, build date ${BUILD_DATE}). Raw .AppImage files, unmodified."
            echo
            echo "SHA-256 of the published files (also attached as SHA256SUMS):"
            echo '```'
            cat release_assets/SHA256SUMS
            echo '```'
            echo
            echo "SHA-256 of the upstream ZIP files:"
            echo '```'
            cat zip_sums.txt
            echo '```'
          } > notes.md

          gh release create "${OWN_TAG}" release_assets/*.AppImage release_assets/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --prerelease \
            --title "TwitchDropsMiner ${OWN_TAG}" \
            --notes-file notes.md
