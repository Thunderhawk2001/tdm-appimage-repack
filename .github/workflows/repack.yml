name: Repack AppImage

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  pull_request:
    paths:
      - ".github/workflows/repack.yml"

concurrency:
  group: repack-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM: DevilXD/TwitchDropsMiner
  UPSTREAM_TAG: dev-build

jobs:
  repack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check, verify, unpack and publish
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_JSON="$(gh api "repos/${UPSTREAM}/releases/tags/${UPSTREAM_TAG}")"
          BODY="$(jq -r '.body // ""' <<<"${RELEASE_JSON}")"
          SHA="$(grep -oE 'Reference commit:[^0-9a-f]*[0-9a-f]{40}' <<<"${BODY}" | grep -oE '[0-9a-f]{40}$' | head -n 1 || true)"
          BUILD_DATE="$(sed -nE 's/.*Last build date:[^0-9]*([0-9-]+ [0-9:]+\+[0-9:]+).*/\1/p' <<<"${BODY}" | head -n 1 || true)"

          if [[ -z "${SHA}" ]]; then
            echo "::error::Kein Reference commit im Upstream-Release gefunden"
            exit 1
          fi

          OWN_TAG="dev-${SHA:0:7}"
          echo "Upstream commit: ${SHA} -> eigener Tag: ${OWN_TAG}"

          if err="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${OWN_TAG}" 2>&1 >/dev/null)"; then
            echo "Release ${OWN_TAG} existiert bereits."
            if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
              echo "Nichts zu tun."
              exit 0
            fi
            echo "Dry-run (pull_request): fahre trotz bestehendem Release fort."
          elif [[ "${err}" != *"HTTP 404"* ]]; then
            echo "::error::GitHub API Fehler beim Pruefen von ${OWN_TAG}: ${err}"
            exit 1
          fi

          ASSETS=(
            "Twitch.Drops.Miner.Linux.AppImage-x86_64.zip"
            "Twitch.Drops.Miner.Linux.AppImage-aarch64.zip"
          )

          for name in "${ASSETS[@]}"; do
            if ! jq -e --arg n "${name}" 'any(.assets[]; .name == $n)' <<<"${RELEASE_JSON}" >/dev/null; then
              echo "::error::Upstream-Asset fehlt: ${name}"
              exit 1
            fi
          done

          mkdir -p dl release_assets
          RELEASE_FILES=()
          : > zip_sums.txt

          for name in "${ASSETS[@]}"; do
            asset_id="$(jq -r --arg n "${name}" 'first(.assets[] | select(.name == $n) | .id)' <<<"${RELEASE_JSON}")"
            digest="$(jq -r --arg n "${name}" 'first(.assets[] | select(.name == $n) | .digest // "")' <<<"${RELEASE_JSON}")"

            if [[ "${digest}" != sha256:* ]]; then
              echo "::error::Fehlender oder ungueltiger SHA-256-Digest fuer ${name}: ${digest}"
              exit 1
            fi

            gh api -H "Accept: application/octet-stream" "repos/${UPSTREAM}/releases/assets/${asset_id}" > "dl/${name}"

            expected="${digest#sha256:}"
            actual="$(sha256sum "dl/${name}" | awk '{print $1}')"
            if [[ "${actual}" != "${expected}" ]]; then
              echo "::error::SHA-256-Abweichung fuer ${name}: erwartet ${expected}, erhalten ${actual}"
              exit 1
            fi
            echo "OK ${name} (${actual})"
            echo "${actual}  ${name}" >> zip_sums.txt

            d="unpack_${name%.zip}"
            unzip -o -q "dl/${name}" -d "${d}"
            f="$(find "${d}" -type f -name '*.AppImage' -print -quit)"
            if [[ -z "${f}" ]]; then
              echo "::error::Keine .AppImage-Datei in ${name} gefunden"
              exit 1
            fi

            target="release_assets/$(basename "${f}")"
            if [[ -e "${target}" ]]; then
              echo "::error::Dateinamen-Konflikt in release_assets: ${target}"
              exit 1
            fi
            mv "${f}" "${target}"
            RELEASE_FILES+=("${target}")
          done

          (cd release_assets && sha256sum -- *.AppImage > SHA256SUMS)
          RELEASE_FILES+=("release_assets/SHA256SUMS")

          {
            echo "Automated repack of upstream ${UPSTREAM_TAG} (commit ${SHA}, build date ${BUILD_DATE}). Raw .AppImage files, unmodified."
            echo
            echo "SHA-256 of the published files (also attached as \`SHA256SUMS\`):"
            echo '```'
            cat release_assets/SHA256SUMS
            echo '```'
            echo
            echo "SHA-256 of the verified upstream ZIP files:"
            echo '```'
            cat zip_sums.txt
            echo '```'
          } > notes.md

          ls -l "${RELEASE_FILES[@]}"
          cat notes.md

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "Dry-run (pull_request): ueberspringe gh release create fuer ${OWN_TAG}."
            exit 0
          fi

          gh release create "${OWN_TAG}" "${RELEASE_FILES[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "TwitchDropsMiner ${OWN_TAG}" \
            --notes-file notes.md
